name: "Release CI/CD"

on:
    push:
        tags: [ '[0-9]*.[0-9]*.[0-9]*' ]

jobs:
    build:
        permissions: "write-all"
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 21

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v5

            -   name: Decode keystore
                run: echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
                env:
                    KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

            -   name: Build release with signing
                run: ./gradlew assembleRelease
                env:
                    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                    KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
                    KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

            -   name: Rename APK
                run: mv app/build/outputs/apk/release/app-release.apk friendly-${{ github.ref_name }}.apk

            -   name: Deploy Release
                uses: softprops/action-gh-release@v2
                with:
                    files: friendly-${{ github.ref_name }}.apk
                    generate_release_notes: true
